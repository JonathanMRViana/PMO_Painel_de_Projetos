name: Publicar painel no GitHub Pages

concurrency:
  group: github-pages
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PMO_GITHUB_PAGES: '1'
      - run: |
          cp -R dist/client/PMO_Painel_de_Projetos/_next dist/client/_next
          rm -rf dist/client/PMO_Painel_de_Projetos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
